; EMBER firmware: one codebase, two roles (sensor node / USB gateway).
;
; Arduino-ESP32 3.x (ESP-IDF 5) is required for the esp_now_recv_info_t callback
; and the ESP_I2S PDM API. The official platformio/espressif32 platform still ships
; Arduino 2.x, so we use the community pioarduino platform.

[platformio]
default_envs = node

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Sense expansion board camera needs the octal PSRAM (board json already defines
; BOARD_HAS_PSRAM and USB CDC on boot).
board_build.arduino.memory_type = qio_opi
build_flags =
    -Wall

; Sensor node. Set the id per board:
;   PLATFORMIO_BUILD_FLAGS=-DNODE_ID=3 pio run -e node -t upload
[env:node]
build_flags =
    ${env.build_flags}
    -DEMBER_ROLE_NODE

; Gateway plugged into the laptop over USB; bridges the mesh to serial.
[env:gateway]
build_flags =
    ${env.build_flags}
    -DEMBER_ROLE_GATEWAY
